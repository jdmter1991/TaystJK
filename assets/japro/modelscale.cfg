# ===========================================
# NOTES
# ===========================================
# 
# Scale Guidelines:
# - 0.1 to 0.5: Very small characters (Yoda, Jawas)
# - 0.5 to 0.8: Small characters (Ewoks, Droids)
# - 0.8 to 1.2: Normal characters (Humans, Humanoids)
# - 1.2 to 2.0: Large characters (Wookiees, Gamorreans)
# - 2.0 to 3.0: Very large characters (Rancor, Bosses)
#
# Performance Notes:
# - Extreme scales may affect collision detection
# - Scales above 2.5 may cause visual glitches
# - Scales below 0.3 may be hard to hit
#
# Server Commands:
# - /modelscale_reload: Reload this configuration
# - /modelscale_list: Show all configured scales
#
# This file is automatically reloaded when modified.
# No server restart required for changes to take effect.
